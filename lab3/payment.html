
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mobile — оплата услуг</title>
    <link rel="stylesheet" href="styles/pages.css">
</head>
<body>

    <header>
        <h1>Mobile</h1>
        <p>Оплата услуг связи</p>
    </header>

    <nav>
        <a href="index.html">Главная</a>
        <a href="tariffs.html">Тарифы</a>
        <a href="payment.html" class="current">Оплата</a>
        <a href="support.html">Поддержка</a>
    </nav>

    <main>
        <h2>Пополнение баланса</h2>
        <p>Заполните форму для пополнения счёта мобильного телефона.</p>

        <form action="#" method="get">
            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="+7 (900) 000-00-00" required>

            <label for="amount">Сумма пополнения:</label>
            <input type="number" id="amount" name="amount"
                   min="1" max="15000" placeholder="Введите сумму" required>

            <label for="method">Способ оплаты:</label>
            <select id="method" name="method">
                <option value="card">Банковская карта</option>
                <option value="wallet">Электронный кошелёк</option>
            </select>

            <button type="submit">Продолжить</button>
        </form>

        <p class="note">
            После заполнения формы проверьте введённые данные.
        </p>
    </main>

    <footer>
        <p>© 2026 Mobile. Все права защищены.</p>
    </footer>

</body>
</html>
